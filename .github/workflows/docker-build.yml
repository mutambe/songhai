name: Build and push Docker images

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "apps/portal/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [site, portal]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/${{ matrix.app }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/songhai-${{ matrix.app }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/songhai-${{ matrix.app }}:${{ github.sha }}
