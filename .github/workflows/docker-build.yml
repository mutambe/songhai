name: Build and push Docker images

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "apps/portal/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [site, portal]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/${{ matrix.app }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/songhai-${{ matrix.app }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/songhai-${{ matrix.app }}:${{ github.sha }}
          # Só o site usa NEXT_PUBLIC_* em componentes de cliente — o Portal
          # ignora estes build-args (não tem ARG correspondente no seu
          # Dockerfile). São valores públicos (URLs, número de WhatsApp),
          # não segredos.
          build-args: |
            NEXT_PUBLIC_PORTAL_URL=https://portal.songhai.cc
            NEXT_PUBLIC_WHATSAPP_PHONE=258848986002
